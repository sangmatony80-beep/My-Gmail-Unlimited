// Top-level build file where you can add configuration options common to all sub-projects/modules.

plugins {
    id 'com.android.application' version '7.4.2' apply false
    id 'com.android.library' version '7.4.2' apply false
}

subprojects {
    // Apply common configurations to all subprojects
    afterEvaluate {
        if (it.plugins.hasPlugin('com.android.application') || it.plugins.hasPlugin('com.android.library')) {
            android {
                compileSdk 34
                
                defaultConfig {
                    minSdk 21
                    targetSdk 34
                }
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// Print build environment info
println("================================")
println("Gradle Build Environment Info")
println("Gradle Version: ${gradle.gradleVersion}")
println("Java Version: ${System.getProperty('java.version')}")
println("Max Heap: ${Runtime.getRuntime().maxMemory() / 1024 / 1024}MB")
println("================================")
