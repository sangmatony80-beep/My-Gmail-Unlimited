name: Android Build CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # ১. কোড চেকআউট করা
    - name: Checkout Code
      uses: actions/checkout@v3

    # ২. JDK সেটআপ (Android এর জন্য Java 11 স্ট্যান্ডার্ড)
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '11'

    # ৩. Gradle ক্যাশিং (বিল্ড স্পিড বাড়ানোর জন্য)
    - name: Gradle Caching
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    # ৪. Gradle Wrapper ডিপি (Executable permission দেওয়া)
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # ৫. অ্যাপ বিল্ড করা (Debug APK তৈরি হবে)
    - name: Build with Gradle
      run: ./gradlew assembleDebug

    # ৬. তৈরি হওয়া APK আপলোড করা
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: real-gmail-app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
